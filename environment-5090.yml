name: sketch5090
# 5090 双卡(Blackwell sm_120)专用环境。
# 与 environment.yml(上游 baseline,torch 2.1 + CUDA 12.1)互不替代。
# 安装位置建议:/data/conda/envs/sketch5090(根盘只剩 24GB,放 / 装不下)。
#
# 用法:
#   conda env create -f environment-5090.yml -p /data/conda/envs/sketch5090
#   conda activate /data/conda/envs/sketch5090
#
# Blackwell 必须用 cu128 wheel,默认 PyPI 的 cu126 wheel 不含 sm_120 kernel。
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # ---- PyTorch 2.7 + CUDA 12.8(首版完整支持 sm_120) ----
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.0+cu128

      # ---- 训练栈(trl 0.11+,与 v2/training/ 里使用的 SFTConfig/DPOConfig 接口对齐) ----
      - transformers==4.46.3
      - trl==0.12.1
      - accelerate==1.1.1
      - peft==0.13.2
      - datasets==2.20.0
      - deepspeed==0.16.1
      - tokenizers>=0.20.0,<0.21

      # ---- 采样后端(0.8.x 是 Blackwell 上较稳定的一档) ----
      - vllm==0.8.5

      # ---- 模型下载(国内云主机 HF 经常被墙;modelscope 兜底) ----
      - modelscope>=1.18

      # ---- 工具与依赖 ----
      - numpy>=1.26,<2.0
      - pandas>=2.0
      - pyarrow>=15.0
      - scipy>=1.13
      - scikit-learn>=1.3
      - tensorboard>=2.18
      - tqdm
      - requests
      - psutil
      - pynvml
      - pyyaml
      - rich
      - sentencepiece
      - pytest
